/* Exposure It brand: black ground, white type, neon #23F135 only as a small accent / call to action, brand green ring #5FBB47.
   Fonts per the 2025 brand guide: Garet/Horizon titles (fallback Montserrat), Inter body. */
:root{--black:#000;--char:#3D3D3D;--gray:#BBBBBB;--light:#F1F1F1;--neon:#23F135;--brand:#5FBB47;--lime:#84DD65;--deep:#49D400;
--ink:#000;--muted:#3D3D3D;--bg:#F1F1F1;--card:#fff;--line:#dcdcdc;--ok:#1f6b12;--okbg:#eaf8e4;--bad:#b4121b;--badbg:#fdecec;
--title:'EI Montserrat',Montserrat,'Arial Black',Arial,sans-serif;--body:'EI Inter',Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
header{background:var(--black);color:#fff;padding:16px 16px 0;border-bottom:4px solid var(--neon)}
header .wrap{display:flex;flex-direction:column;gap:10px}
header .wm{display:block;height:auto;width:min(230px,62vw)}
header h1{font:800 15px/1.25 var(--title);letter-spacing:.14em;text-transform:uppercase;margin:0;color:#fff}
header p{margin:2px 0 14px;font-size:13px;color:var(--gray)}
.wrap{max-width:640px;margin:0 auto}
main{padding:14px 14px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 12px}
h2{font:800 17px/1.3 var(--title);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
h3{font:700 15px/1.3 var(--title);letter-spacing:.03em;margin:0 0 4px}
.muted{color:var(--muted);font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:14px 16px;font:700 15px/1.2 var(--title);letter-spacing:.04em;background:var(--neon);color:#000;cursor:pointer;margin-top:10px;text-align:center}
.btn:hover{filter:brightness(.95)}
.btn.alt{background:#000;color:#fff}
.btn.ghost{background:transparent;color:var(--muted);font:500 14px var(--body);letter-spacing:0}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px}.row .btn{flex:1}
.quiz-item{display:flex;align-items:center;gap:12px;cursor:pointer;border-left:4px solid #000}
.quiz-item:hover{border-left-color:var(--neon)}
.quiz-item .badge{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:800 15px var(--title);background:#000;color:#fff;border:3px solid var(--brand)}
.quiz-item .badge.pass{background:var(--neon);color:#000;border-color:#000}
.quiz-item .info{flex:1;min-width:0}
.quiz-item .score{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font:700 11px/1.6 var(--title);letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:2px 9px;background:#000;color:#fff}
.pill.ok{background:var(--neon);color:#000}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.gold{background:var(--light);color:#000}
.bar{height:8px;background:#e2e2e2;border-radius:99px;overflow:hidden;margin:8px 0 2px}
.bar>i{display:block;height:100%;background:var(--neon);border-radius:99px;transition:width .3s}
.qtype{font:700 11px/1.4 var(--title);letter-spacing:.12em;text-transform:uppercase;color:var(--char);margin-bottom:8px}
.qtext{font-size:18px;font-weight:600;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:13px 14px;margin:0 0 10px;font:16px/1.4 var(--body);color:var(--ink);cursor:pointer}
.opt:hover{border-color:#000}
.opt.sel{border-color:#000;background:var(--light)}
.opt.right{border-color:var(--brand);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:99px;background:#000;color:var(--neon);font:800 12px var(--title);margin-right:8px}
.picked{border:2px dashed var(--gray);border-radius:10px;padding:8px;min-height:48px;margin-bottom:10px}
.picked .opt{margin:4px 0;border-style:solid}
.matchrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.matchrow b{display:block;margin-bottom:6px}
select{width:100%;font:16px var(--body);padding:10px;border-radius:8px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.matchrow.right{border-color:var(--brand);background:var(--okbg)}.matchrow.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{border-radius:10px;padding:12px 14px;margin-top:6px;font-size:15px}
.fb.ok{background:var(--okbg);border:1px solid var(--brand)}.fb.bad{background:var(--badbg);border:1px solid #f1b5b8}
.fb strong{display:block;font:800 15px var(--title);letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.fb .review{margin-top:6px;font-size:14px;color:var(--muted)}
.tag{font:700 10px/1.6 var(--title);letter-spacing:.1em;border-radius:4px;padding:1px 6px;margin-left:8px;background:#000;color:#fff;vertical-align:middle}
.tag.emergency{background:var(--bad)}
.big{font:800 44px/1.1 var(--title);margin:4px 0}
.missed{font-size:14px;border-left:3px solid var(--bad);padding:4px 0 4px 10px;margin:8px 0}
.flash{min-height:220px;border-radius:14px;border:2px solid #000;background:#000;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:22px;cursor:pointer;user-select:none;margin-bottom:4px}
.flash .term{font:800 22px/1.3 var(--title);letter-spacing:.04em}
.flash .def{font-size:18px;font-weight:600}
.flash .ex{font-size:14px;color:var(--gray);margin-top:10px}
.flash .small{color:var(--gray)}
.flash .grp{color:var(--neon);font:700 11px var(--title);letter-spacing:.12em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 10px;font:13px var(--body);cursor:pointer;color:var(--ink)}
.chip.on{background:#000;color:#fff;border-color:#000}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font:700 11px var(--title);letter-spacing:.08em;text-transform:uppercase}
.center{text-align:center}
.small{font-size:12px;color:var(--muted)}
.hidden{display:none}
.emb{width:48px;height:48px;flex:none}
footer{background:#000;color:var(--gray);text-align:center;font-size:12px;padding:16px 14px calc(16px + env(safe-area-inset-bottom));margin-top:8px;border-top:4px solid var(--neon)}
footer b{color:#fff;font:700 11px var(--title);letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:2px}
footer .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--neon);margin:0 6px;vertical-align:middle}
</style>

<script id="qdata" type="application/json">{"version": "2026-10-09", "quizzes": [{"id": "d1", "title": "Day 1 · Mon Oct 12", "goal": "Get set up and see how a morning works", "when": "Take it after your 1:00 block", "pass": 6, "questions": [{"type": "mc", "q": "What is the delivery promise we give clients?", "options": ["By 10:30 AM", "Noon the next business day", "Within 24 hours", "Same day"], "answer": 1, "why": "Noon the next business day, Eastern time, is the only promise a client hears.", "card": "Card T01: Foundations: company, rules, people, security", "id": "d1-1"}, {"type": "tf", "q": "It is fine to tell a client \"we usually have it out by 10:30.\"", "answer": false, "why": "10:30 to 11 AM is our internal target. Clients only ever hear noon the next business day.", "card": "Card T01: Foundations: company, rules, people, security", "id": "d1-2"}, {"type": "scenario", "q": "A photographer DMs you: \"Quick, what is the Spiro password? I am locked out.\" What do you do?", "options": ["Paste it in the DM so he can get going", "Point him to the 1Password team vault, or to Luke for access", "Text it to his phone instead of Slack"], "answer": 1, "why": "Passwords live only in the 1Password team vault. Never in Slack, email, text or Hive.", "card": "Card T01: Foundations: company, rules, people, security", "id": "d1-3"}, {"type": "match", "q": "Match each person to what they handle.", "pairs": [["Dylan", "Photographers only"], ["Warly", "Formal photo edits, Tue to Fri"], ["Joan", "Overnight QC and the \"All folders QC'd\" post"], ["Eden", "Sends deliveries Tue to Fri"], ["Zach", "Your backup when Luke does not answer in 15 minutes"]], "why": "Every question has an owner. Luke makes the decisions, Zach backs him up.", "card": "Who to ask card", "id": "d1-4"}, {"type": "mc", "q": "Who is NOT working on a Monday morning?", "options": ["Luke and Zach", "Eden and Warly", "Joan and Dylan", "Nobody, everyone works Mondays"], "answer": 1, "why": "No Eden and no Warly on Mondays. That is why you run Mondays from Oct 19.", "card": "Card T01: Foundations: company, rules, people, security", "id": "d1-5"}, {"type": "scenario", "q": "1:40 PM. A photographer calls: he tripped on the homeowner's stairs, his wrist hurts and a framed picture broke. What do you do first?", "options": ["Make sure everyone is OK, then call Luke or Zach right away", "Tell him to finish the shoot and send photos of the damage later", "Email the agent to apologize for the picture"], "answer": 0, "why": "Injury and property damage are on the \"stop and call now\" list. People first, then Luke or Zach.", "card": "Card T01: Foundations: company, rules, people, security", "tag": "emergency", "id": "d1-6"}, {"type": "mc", "q": "Which message sounds like Exposure It?", "options": ["\"Per our policy, availability is limited. Please advise.\"", "\"Happy to help. I can do Thursday at 9 or 11. Which works?\"", "\"OMG we would LOVE to shoot this amazing home!!!\"", "\"Open slots: Tue 9, Tue 11, Wed 1, Wed 3, Thu 9. Also what package, and drone?\""], "answer": 1, "why": "Friendly, short, plain words and one clear ask.", "card": "Card T01: Foundations: company, rules, people, security", "id": "d1-7"}, {"type": "order", "q": "Put the life of an order in the right order.", "steps": ["Agent books the shoot in Spiro", "Photographer shoots the home", "Overnight team edits the photos", "Joan finishes QC and posts \"All folders QC'd\"", "We deliver in Spiro and get paid"], "why": "Booking, shoot, overnight edit, QC, then delivery and payment. Everything follows Spiro.", "card": "Card P6: How an order flows here", "id": "d1-8"}]}, {"id": "d2", "title": "Day 2 · Tue Oct 13", "goal": "Know what we sell", "when": "Take it in your 10:00 learning block", "pass": 6, "questions": [{"type": "mc", "q": "What decides which photo package (Basic, Pro, Deluxe) a client needs?", "options": ["The size of the house", "The photo count they want", "The price of the home", "The photographer"], "answer": 1, "why": "Photo count sets the package. Square feet only set the slot length.", "card": "Card T02: Products, packages and prices", "id": "d2-1"}, {"type": "mc", "q": "What is in the Zillow Package?", "options": ["Photos and a floor plan", "Photos, drone, Zillow 3D tour and interactive floor plan", "Photos, video and drone", "Zillow 3D tour only"], "answer": 1, "why": "The Zillow Package is photos, drone, Zillow 3D tour and the interactive floor plan. Quote the price from the current price list.", "card": "Card T02: Products, packages and prices", "id": "d2-2"}, {"type": "tf", "q": "For a good client, you can bundle the Premium Social Media Reel at a lower price.", "answer": false, "why": "The Premium Social Media Reel is never bundled and never discounted. Its price is on the price list.", "card": "Card T02: Products, packages and prices", "id": "d2-3"}, {"type": "scenario", "q": "A busy agent says: \"I send you 8 listings a month. Can I get 10% off?\" What do you say?", "options": ["\"Sure, I can do 10% for you.\"", "\"I will pass this to Luke or Zach and get back to you by tomorrow.\"", "\"No, we never do discounts.\""], "answer": 1, "why": "Discounts are Luke or Zach's call. You pass it on and give a reply time.", "card": "Card T02: Products, packages and prices", "tag": "money", "id": "d2-4"}, {"type": "mc", "q": "What tax goes on our invoices?", "options": ["None", "6% Pennsylvania sales tax", "7% Pennsylvania sales tax", "It depends on the client"], "answer": 2, "why": "Prices on the price list are before tax. 7% Pennsylvania sales tax is added.", "card": "Card T02: Products, packages and prices", "id": "d2-5"}, {"type": "scenario", "q": "An agent wants a shoot far outside our normal service area, past the custom quote distance on the price list. What do you do?", "options": ["Book it at normal price", "Add a travel fee yourself", "Take the details and pass it to Luke or Zach for a custom quote"], "answer": 2, "why": "Past the custom quote distance, Luke or Zach give a custom quote. You never set a travel fee yourself.", "card": "Card T02: Products, packages and prices", "id": "d2-6"}, {"type": "order", "q": "Put the listing clock in order.", "steps": ["Listing agreement signed", "Photos taken", "Listing goes live", "Under contract", "Closing"], "why": "Our media lands between the agreement and go live. A late delivery can cost the agent a weekend of showings.", "card": "Card P3: The listing clock", "id": "d2-7"}, {"type": "mc", "q": "An agent asks the price of virtual staging. Where does your answer come from?", "options": ["Your best guess", "The current price list (price card)", "What we charged the last agent", "A competitor's website"], "answer": 1, "why": "Always quote from the current price list. Staging is in a test phase, so do not promise a delivery time yet.", "card": "Card T02: Products, packages and prices", "id": "d2-8"}]}, {"id": "d3", "title": "Day 3 · Wed Oct 14", "goal": "Work the morning to do list", "when": "Take it in your 10:00 learning block", "pass": 6, "questions": [{"type": "mc", "q": "What is your to do list every morning?", "options": ["Your email inbox", "Rory's morning brief in #ops-alerts (about 8:09)", "The Hive home page", "Whatever Luke texts you"], "answer": 1, "why": "Work Rory's brief top to bottom and check mark each line when it is handled.", "card": "Card T03: Hive, the #ops-alerts queue and data cautions", "id": "d3-1"}, {"type": "tf", "q": "A check mark on an #ops-alerts post means \"I have seen it.\"", "answer": false, "why": "A check mark means handled. If you cannot finish it, reply in the thread with the reason and the next step.", "card": "Card T03: Hive, the #ops-alerts queue and data cautions", "id": "d3-2"}, {"type": "scenario", "q": "The brief says 123 Example St is due by 10:30. Spiro shows it was delivered at 7:50 AM. What do you do?", "options": ["Deliver it again to be safe", "Trust Spiro, check mark the item, note the mismatch if it keeps happening", "Ask Eden what happened and wait"], "answer": 1, "why": "Spiro is the source of truth. The sheets and Hive follow Spiro.", "card": "Card T03: Hive, the #ops-alerts queue and data cautions", "id": "d3-3"}, {"type": "scenario", "q": "10:00 AM. Everything for an order is ready except the Zillow floor plan, which still says Processing. What next?", "options": ["Hold the whole delivery until the floor plan is done", "Deliver the rest now with the floor plan delay email (CC admin@), then redeliver when Zillow finishes", "Ask Dylan for a rescan"], "answer": 1, "why": "Never let one stuck item make the whole job late.", "card": "Card T04: Morning delivery watch and delivery rules", "id": "d3-4"}, {"type": "match", "q": "Match each alert to what you do.", "pairs": [["Delivery risk alert", "Find the blocker, give the client a real time, reply in the thread"], ["AutoHDR credits low", "Tell Luke right away"], ["Sheet vs Spiro mismatch", "Trust Spiro and fix the sheet"], ["Edit intake post", "Write a formal request in #edit-requests the same day"], ["Voicemail in #client-inbox", "Call back within 15 minutes"]], "why": "Every bot post has one clear action. The Alert decoder lists them all.", "card": "Alert decoder", "id": "d3-5"}, {"type": "order", "q": "Put the lines of a formal edit request in order.", "steps": ["🏠 Address", "Admin or Client Request, preventable or not preventable", "Dropbox link", "Each fix on its own line"], "why": "Use the Hive daytime edit request template exactly. No freeform requests in #edit-requests.", "card": "Card T13: Overnight handoff and edit requests", "id": "d3-6"}, {"type": "scenario", "q": "Wednesday 11 AM, you are alone. An agent calls asking for a discount on a big order. What do you do?", "options": ["Give 10% so you do not lose the order", "Take her details, promise nothing, and say Luke will call her back today", "Tell her to email instead"], "answer": 1, "why": "That is the callback script: take the details, promise nothing, Luke calls back today.", "card": "Card T08: Phone, text and inbox desk", "tag": "money", "id": "d3-7"}, {"type": "mc", "q": "A job was delivered late. What three things must it have before you close it?", "options": ["A DELIVERED mark, the time and a late reason", "An apology email, a discount and a note", "Luke's OK, a Hive loop and a check mark", "Nothing extra"], "answer": 0, "why": "DELIVERED mark, time and late reason, logged on the dashboard.", "card": "Card T04: Morning delivery watch and delivery rules", "id": "d3-8"}]}, {"id": "d4", "title": "Day 4 · Thu Oct 15", "goal": "Do the real work with Luke watching", "when": "Take it in your 10:00 learning block", "pass": 6, "questions": [{"type": "mc", "q": "When can you accept a Zillow Showcase request?", "options": ["As soon as the agent asks", "When the media is captured AND the agent has paid us", "After Luke approves each one", "Only on Mondays"], "answer": 1, "why": "Captured and paid, both. If it is unpaid, hold it and tell Luke.", "card": "Card T05: Daily sheets and Zillow Showcase", "id": "d4-1"}, {"type": "order", "q": "Put the Showcase photos in the right order.", "steps": ["Front exterior", "Through the house, room by room", "Other exteriors", "Drone"], "why": "Front exterior first, through the house, exteriors, then drone last. Detail shots stay with their rooms.", "card": "Card T05: Daily sheets and Zillow Showcase", "id": "d4-2"}, {"type": "scenario", "q": "Rory posts: \"Heard on Quo, not in Spiro yet: cancel, 456 Sample Ave.\" Spiro shows the shoot tomorrow at 9 AM. What do you do?", "options": ["Cancel it on today's sheets right away", "Confirm with the client, cancel in Spiro, log a fee case (it is inside 24 hours), check mark. No sheet change, it is tomorrow", "Ignore it until the client emails"], "answer": 1, "why": "Spiro first. Sheets only change for today's jobs, because Build Sheet picks up future days.", "card": "Card T06: Own #schedule-changes and calendar control", "id": "d4-3"}, {"type": "tf", "q": "On a quiet Wednesday you should get ahead and build Thursday's and Friday's tabs.", "answer": false, "why": "Only build the next business day's tab, the morning or lunchtime before.", "card": "Card T05: Daily sheets and Zillow Showcase", "id": "d4-4"}, {"type": "money", "q": "A reschedule comes in 20 hours before the shoot. What else do you do?", "options": ["Nothing, just move it", "Log a fee case", "Charge the late fee on the spot", "Cancel the shoot"], "answer": 1, "why": "Inside 24 hours is a fee case. Luke or Zach decide any fee. You may only waive an agent's first late fee, with a note.", "card": "Card T06: Own #schedule-changes and calendar control", "id": "d4-5"}, {"type": "mc", "q": "A photographer is free after a cancel. Who decides which shoot he picks up?", "options": ["You", "The agent", "Dylan", "Eden"], "answer": 2, "why": "You propose the move after checking preferred photographers. Dylan decides.", "card": "Card T06: Own #schedule-changes and calendar control", "id": "d4-6"}, {"type": "mc", "q": "Getting paid at delivery: which payment link do you send a client?", "options": ["The Spiro admin invoice link", "Only the \"Open client payment link\"", "A Stripe link you make yourself", "No link, they will pay later"], "answer": 1, "why": "Charge the card on file when there is one. Otherwise send only the \"Open client payment link\".", "card": "Card T17: Orders, fees, special deliveries and payment", "id": "d4-7"}, {"type": "tf", "q": "Some brokerages' email systems drop our automatic Spiro delivery email. Agents at those brokerages also get a manual delivery email with the payment link.", "answer": true, "why": "Check the client rules before you deliver. If the brokerage is on the manual email list, send a manual email too.", "card": "Card T04: Morning delivery watch and delivery rules", "id": "d4-8"}]}, {"id": "d5", "title": "Day 5 · Fri Oct 16", "goal": "Get ready for your solo Monday", "when": "Take it before the 8:00 practice Monday", "pass": 6, "questions": [{ bes"], "answer": 0, "why": "Warly Tuesday 9 AM via #edit-requests. Warly does not work Mondays.", "card": "Card T07: Monday solo playbook", "id": "w1-3"}, {"type": "mc", "q": "What makes a Monday edit urgent?", "options": ["The agent is upset", "The listing goes live, or has a showing or open house, before Tuesday noon", "It is a drone photo", "Zach says so"], "answer": 1, "why": "The listing goes live, or has a showing or open house, before Tuesday noon. Urgent ones go to the overnight team that night.", "card": "Card T07: Monday solo playbook", "id": "w1-4"}, {"type": "mc", "q": "Where do urgent Monday edits go?", "options": ["#edit-requests only", "Jobs sheet photo notes before 5 PM plus #photo-editing", "Warly's DM", "Email"], "answer": 1, "why": "Jobs sheet photo notes before 5 PM plus #photo-editing. So the overnight editors see it before they start.", "card": "Card T13: Overnight handoff and edit requests", "id": "w1-5"}, {"type": "mc", "q": "No QC post from Joan on a Monday morning. What do you do?", "options": ["Wait", "Do the hands on check yourself on every set", "Call Joan", "Deliver without checking"], "answer": 1, "why": "Do the hands on check yourself on every set. On Mondays, no post means you check every set.", "card": "Monday playbook", "id": "w1-6"}, {"type": "mc", "q": "Spiro and the Delivery Status sheet disagree. Which wins?", "options": ["The sheet", "Hive", "Spiro", "The dashboard"], "answer": 2, "why": "Spiro. Spiro is the source of truth.", "card": "Card T03: Hive, the #ops-alerts queue and data cautions", "id": "w1-7"}, {"type": "mc", "q": "A check mark on an #ops-alerts post means:", "options": ["Seen", "Handled", "Assigned", "Escalated"], "answer": 1, "why": "Handled. A check mark means handled, not seen.", "card": "Card T03: Hive, the #ops-alerts queue and data cautions", "id": "w1-8"}, {"type": "mc", "q": "A photographer texts at 7:50 AM that he is sick. First call?", "options": ["Cancel his shoots", "Dylan, then phone Luke", "Eden", "The agents"], "answer": 1, "why": "Dylan, then phone Luke. Dylan owns photographers. A sick photographer with a full day is a stop and call item.", "card": "Card T07: Monday solo playbook", "id": "w1-9"}, {"type": "mc", "q": "AutoHDR credits are low at 4 PM. When do you tell Luke?", "options": ["Right away", "At 5 PM", "Tomorrow", "Not needed"], "answer": 0, "why": "Right away. Only Luke tops up, and editing stalls overnight.", "card": "Alert decoder", "id": "w1-10"}, {"type": "mc", "q": "A #schedule-changes post moves a job from Thursday to Friday. Do you change the sheets?", "options": ["Yes, both", "No, Spiro only. Build Sheet picks up future days", "Only the Jobs sheet", "Ask Eden"], "answer": 1, "why": "No, Spiro only. Build Sheet picks up future days. Spiro is updated. Sheets only change for today's jobs.", "card": "Card T06: Own #schedule-changes and calendar control", "id": "w1-11"}, {"type": "mc", "q": "A Zillow floor plan is still Processing at 10 AM.", "options": ["Hold the delivery", "Deliver the rest with the floor plan delay email (CC admin@) and redeliver later", "Ask Dylan for a rescan", "Cancel the floor plan"], "answer": 1, "why": "Deliver the rest with the floor plan delay email (CC admin@) and redeliver later. Never let one stuck item make the whole job late.", "card": "Card T04: Morning delivery watch and delivery rules", "id": "w1-12"}, {"type": "mc", "q": "Who do you ask about a photographer's missing upload?", "options": ["Warly", "Dylan", "Joan", "Viktor"], "answer": 1, "why": "Dylan. Dylan handles photographers only.", "card": "Who to ask card", "id": "w1-13"}, {"type": "mc", "q": "During the staging test phase, may a staged photo go to a client?", "options": ["Yes", "Only on Mondays", "No, not until Luke says staging is live", "If Viktor posted it"], "answer": 2, "why": "No, not until Luke says staging is live. Staging is in a test phase.", "card": "Card T16: Media vendors: Zillow, CubiCasa, AutoHDR, staging, video, Matterport", "id": "w1-14"}, {"type": "mc", "q": "Once T15 and T17 are signed off, which two money calls are yours (telling Luke the same day)? Until then you call Luke first.", "options": ["Refund and discount", "Free return trip when we clearly missed media, and a removal fee up to 2 photos", "Travel fee and rush fee", "None"], "answer": 1, "why": "Free return trip when we clearly missed media, and a removal fee up to 2 photos. Until then, call Luke first every time.", "card": "Monday playbook", "id": "w1-15"}, {"type": "mc", "q": "What goes in the 5 PM thread?", "options": ["A full report", "Five short lines: deliveries, open items, decisions needed, tomorrow, FYI", "Only problems", "Nothing on Mondays"], "answer": 1, "why": "Five short lines: deliveries, open items, decisions needed, tomorrow, FYI. Short and the same every day, in #ops-alerts.", "card": "Card T07: Monday solo playbook", "id": "w1-16"}, {"type": "mc", "q": "Who is your backup when Luke does not answer in 15 minutes?", "options": ["Dylan", "Eden", "Zach", "Joan"], "answer": 2, "why": "Zach. Luke is on call, Zach is backup.", "card": "Who to ask card", "id": "w1-17"}, {"type": "mc", "q": "Office hours clients hear:", "options": ["8 to 5", "9 to 5", "7 to 3", "24/7"], "answer": 1, "why": "9 to 5. Office hours clients hear are 9 to 5.", "card": "Card T01: Foundations: company, rules, people, security", "id": "w1-18"}, {"type": "mc", "q": "An agent at a brokerage that needs a manual delivery email. Their delivery also needs:", "options": ["Brokerage A sizing", "A manual delivery email with the payment link", "A Dropbox folder", "Nothing extra"], "answer": 1, "why": "A manual delivery email with the payment link. Their email system drops the Spiro email. The client rules list which brokerages.", "card": "Card T04: Morning delivery watch and delivery rules", "id": "w1-19"}, {"type": "mc", "q": "Where do you post a late virtual staging request?", "options": ["#edit-requests", "#virtual-staging", "#delivery-updates", "Email Viktor"], "answer": 1, "why": "#virtual-staging. Viktor and the staging team work there.", "card": "Alert decoder", "id": "w1-20"}]}, {"id": "rm", "title": "Ready for Monday", "goal": "12 real Monday moments", "when": "Friday, before the \"Ready for solo Monday?\" review", "pass": 10, "strict": true, "questions": [{"type": "scenario", "q": "8:00. Saturday 6 PM voicemail: an agent cancels a Monday 2 PM shoot. What do you do?", "options": ["Charge the late cancel fee", "No fee, it was more than 24 hours' notice. Confirm with the agent, cancel in Spiro, update today's sheets, check mark", "Leave it for Luke"], "answer": 1, "why": "More than 24 hours is no fee. It is a same day job, so today's sheets change too.", "card": "Card T06: Own #schedule-changes and calendar control", "tag": "money", "id": "rm-1"}, {"type": "scenario", "q": "8:09. The brief flags 789 Sample Rd: Spiro has the vertical photos add-on, the sheet does not. What do you do?", "options": ["Remove it from Spiro to match the sheet", "Fix the sheet to match Spiro, then check mark", "Ask the agent which is right"], "answer": 1, "why": "Spiro wins every time.", "card": "Card T05: Daily sheets and Zillow Showcase", "id": "rm-2"}, {"type": "scenario", "q": "8:20. #edit-requests-intake: an agent wants a circled item removed at 12 Demo Ln. The listing does not go live until Thursday. What do you do?", "options": ["Send it to the overnight editors tonight", "Write a formal request in #edit-requests with the exact template. Warly does it Tuesday at 9 AM", "Leave it for Tuesday"], "answer": 1, "why": "Not urgent (nothing before Tuesday noon), so it goes to Warly. Route it the same day so it does not sit.", "card": "Card T13: Overnight handoff and edit requests", "id": "rm-3"}, {"type": "scenario", "q": "8:35. No QC post from Joan. What do you do?", "options": ["Wait until 10", "Do the hands on check yourself on every set", "Call Joan"], "answer": 1, "why": "On Mondays no post means you check every set yourself.", "card": "Monday playbook", "id": "rm-4"}, {"type": "scenario", "q": "8:50. Delivery risk alert: a video was due Saturday and the photographer never uploaded clips. What do you do?", "options": ["Wait for the clips to show up", "Dylan for the photographer, give the client a real time, and DM Luke now because it is past due. Phone him if it will miss noon", "Tell the client it is the photographer's fault"], "answer": 1, "why": "A missed promise is a stop and call item. No client finds out from us late.", "card": "Alert decoder", "tag": "emergency", "id": "rm-5"}, {"type": "scenario", "q": "9:45. An agent complains her 3D tour is missing on Zillow and asks for her money back. What do you do?", "options": ["Refund the tour", "Acknowledge, check the Zillow tours list, open a Hive loop, tell her when she will hear back. Refunds are Luke or Zach's call", "Offer a free reel instead"], "answer": 1, "why": "Never promise a refund, discount or fee you do not own.", "card": "Card T01: Foundations: company, rules, people, security", "tag": "money", "id": "rm-6"}, {"type": "scenario", "q": "10:30. \"AutoHDR credits low\" posts in #ops-alerts. What do you do?", "options": ["Mention it at 5 PM", "DM or call Luke right away. Never move a job to another tool", "Ask Joan to slow down"], "answer": 1, "why": "Only Luke tops up credits, and editing stalls overnight without them.", "card": "Alert decoder", "tag": "emergency", "id": "rm-7"}, {"type": "scenario", "q": "11:00. An agent calls: \"My photographer never showed up for my 11 AM!\" What do you do?", "options": ["Promise a discount to calm her down", "Call Dylan first about the photographer, quote no fee, open a Hive loop. If she asks for an owner, call Luke", "Rebook her yourself for tomorrow"], "answer": 1, "why": "Photographer problems go to Dylan. Money and owner requests go to Luke.", "card": "Who to ask card", "id": "rm-8"}, {"type": "scenario", "q": "1:00. Rory posts a Showcase alert: a paid Zillow Showcase order is waiting. What do you do?", "options": ["Leave it for Eden on Tuesday", "Fulfill it in Aryeo yourself and check mark the alert", "Tell the agent it will be Tuesday"], "answer": 1, "why": "On Mondays Showcase is yours. Follow the tag.", "card": "Card T05: Daily sheets and Zillow Showcase", "id": "rm-9"}, {"type": "scenario", "q": "2:15. An agent says she is calling her lawyer about a scratched floor from Friday's shoot. What do you do?", "options": ["Apologize and offer to pay for the floor", "Stay calm, take the details, promise nothing and call Luke now", "Email her later today"], "answer": 1, "why": "Legal and property damage are on the stop and call now list.", "card": "When in doubt tree", "tag": "emergency", "id": "rm-10"}, {"type": "scenario", "q": "7:50 AM. A photographer texts that he is sick. He has a full day of shoots. What do you do?", "options": ["Cancel all his shoots in Spiro", "Message Dylan now and phone Luke. Call the agents once you know the plan", "Wait to see if he feels better"], "answer": 1, "why": "A sick photographer with a full day is a stop and call item. Dylan handles the photographers.", "card": "Card T07: Monday solo playbook", "tag": "emergency", "id": "rm-11"}, {"type": "scenario", "q": "Oct 19. An agent says we clearly missed the back yard photos and asks for a free return trip. What do you do?", "options": ["Book the free return trip, then tell Luke tonight", "Call Luke first before you agree to anything", "Charge the normal return trip fee"], "answer": 1, "why": "Until T15 and T17 are signed off you call Luke first on every return trip and removal fee.", "card": "Monday playbook", "tag": "money", "id": "rm-12"}]}], "glossary": [{"term": "Listing agent", "definition": "Agent for the seller. Our usual client.", "group": "Industry", "example": "The agent who books a Pro Photo Package for her new listing is the listing agent."}, {"term": "Buyer's agent", "definition": "Agent for the buyer. Rarely buys media.", "group": "Industry", "example": "A buyer's agent calls to ask about a home their client wants to tour. They are not usually booking media."}, {"term": "Brokerage", "definition": "The company an agent works under.", "group": "Industry", "example": "An agent's Spiro profile shows they work under Brokerage A. That is their brokerage."}, {"term": "Broker", "definition": "Licensed person who runs or supervises an office.", "group": "Industry", "example": "An email signed by the managing broker of an office is from the licensed person who supervises its agents."}, {"term": "Team", "definition": "A group of agents under a lead, for example \"The Example Team\".", "group": "Industry", "example": "The Example Team is a team. Some teams get extra delivery steps, so check the client rules before you deliver."}, {"term": "Builder", "definition": "New construction client, for example Builder A or Builder B.", "group": "Industry", "example": "Builder A is a builder client. A new builder lead gets a reply within 4 business hours and Luke is looped in."}, {"term": "Listing", "definition": "A home for sale.", "group": "Industry", "example": "When an agent says 'my new listing goes up Thursday', they mean the home they are selling."}, {"term": "Listing agreement", "definition": "Seller signs with the agent. Starts the clock.", "group": "Industry", "example": "Once the seller signs the listing agreement, the agent starts planning photos."}, {"term": "MLS", "definition": "Shared regional listing database.", "group": "Industry", "example": "An agent uploads our MLS sized photos to their MLS so the home shows up for other agents. Our MLS details are a placeholder for Luke or Zach to fill in."}, {"term": "Go live / Active", "definition": "Listing is public on the MLS.", "group": "Industry", "example": "An agent who wants to go live Friday needs photos delivered before then."}, {"term": "Showing", "definition": "Private tour of the home.", "group": "Industry", "example": "A buyer's agent sets up a showing so their client can tour the home privately."}, {"term": "Open house", "definition": "Public showing at a set time.", "group": "Industry", "example": "An agent wants the photos up before Sunday's open house."}, {"term": "Pending / Under contract", "definition": "Offer accepted, not closed.", "group": "Industry", "example": "An agent says the home went under contract, so the offer is accepted but the sale has not closed."}, {"term": "Closing", "definition": "Sale completes.", "group": "Industry", "example": "Most agents are paid their commission at closing, when the sale completes."}, {"term": "DOM", "definition": "Days on market.", "group": "Industry", "example": "An agent mentions their listing has high DOM, meaning it has been on the market a long time."}, {"term": "Commission", "definition": "How agents are paid, usually at closing.", "group": "Industry", "example": "An agent pays for our media up front and is usually paid commission only when the home closes."}, {"term": "Realtor", "definition": "Agent who is a member of NAR.", "group": "Industry", "example": "An agent who calls themselves a Realtor is a member of NAR."}, {"term": "FSBO", "definition": "For sale by owner. Same prices for homeowners.", "group": "Industry", "example": "A homeowner selling on their own calls to book photos. They get the same prices as agents."}, {"term": "Realtor.com / Zillow", "definition": "Big listing sites fed by MLS data.", "group": "Industry", "example": "After an agent posts to the MLS, the photos show up on Zillow and Realtor.com."}, {"term": "Basic / Pro / Deluxe Photo Package", "definition": "25 to 35 / 45 to 55 / 55 to 65 photos plus drone.", "group": "What we sell", "example": "An agent who needs about 50 photos books the Pro Photo Package (45 to 55 photos)."}, {"term": "Zillow Package", "definition": "Photos, drone, Zillow 3D tour and floor plan.", "group": "What we sell", "example": "An agent who wants photos, drone, a Zillow 3D tour and a floor plan books the Zillow Package."}, {"term": "Agent's Choice Bundle", "definition": "Photos, drone, Zillow 3D, floor plan, cinematic video.", "group": "What we sell", "example": "An order for photos, drone, Zillow 3D, a floor plan and cinematic video shows as the Agent's Choice Bundle in Spiro."}, {"term": "Brand Builder Bundle", "definition": "Agent reel (vertical) and agent video tour (horizontal).", "group": "What we sell", "example": "An agent who wants a vertical agent reel and a horizontal agent video tour books the Brand Builder Bundle."}, {"term": "Luxury Listing Bundle", "definition": "Everything plus detail photos, twilight, fire, wire removal.", "group": "What we sell", "example": "A high end listing with detail photos, twilight, fire and wire removal comes through as the Luxury Listing Bundle."}, {"term": "Listing Video Package", "definition": "Photos, drone, cinematic video.", "group": "What we sell", "example": "An agent who wants photos, drone and a cinematic video books the Listing Video Package."}, {"term": "Agent Video Package", "definition": "Photos, drone, video featuring the agent.", "group": "What we sell", "example": "An agent who wants to appear on camera in the listing video books the Agent Video Package."}, {"term": "Build Your Own Bundle", "definition": "Spiro package name on 94 shoots. Read the order for contents.", "group": "What we sell", "example": "An order says Build Your Own Bundle, so you read the order to see what was picked."}, {"term": "Select Individual Services", "definition": "Spiro name for single services orders.", "group": "What we sell", "example": "An agent orders just a floor plan. Spiro shows it as Select Individual Services."}, {"term": "Interior Photos Only", "definition": "Single service. Price is on the price list.", "group": "What we sell", "example": "An agent who only needs inside photos books Interior Photos Only."}, {"term": "Legacy package names", "definition": "Core, Reach, Launch, Standard MLS Listing, Listing Showcase.", "group": "What we sell", "example": "An old Spiro order says Listing Showcase. That is a legacy name, so check the order contents."}, {"term": "Essential / Signature / Premium", "definition": "Old package names in Hive that Spiro does not use. Hive is switching to the Spiro names.", "group": "What we sell", "example": "Hive mentions a Signature package, but Spiro does not use that name. Go by Spiro."}, {"term": "Add-on", "definition": "Extra service on a package.", "group": "What we sell", "example": "An agent adds virtual staging to a Pro Photo Package. Staging is the add-on."}, {"term": "Drone photos / drone video", "definition": "Aerial media, airspace check first.", "group": "What we sell", "example": "Before a drone shoot, the airspace is checked first. The dashboard has a drone airspace page."}, {"term": "Part 107", "definition": "FAA drone pilot certificate our pilots hold.", "group": "What we sell", "example": "A client asks if our drone pilots are licensed. Yes: they hold the FAA Part 107 certificate."}, {"term": "Cinematic video tour", "definition": "60 to 90 second walkthrough video.", "group": "What we sell", "example": "The listing video is a cinematic video tour, a 60 to 90 second walkthrough."}, {"term": "Agent featured video", "definition": "Video with the agent on camera.", "group": "What we sell", "example": "The agent walks through the kitchen talking to the camera in an agent featured video."}, {"term": "Premium Social Media Reel", "definition": "Standalone only. Price is on the price list.", "group": "What we sell", "example": "An agent asks to add the reel to a bundle at a discount. It is standalone only, never bundled or discounted."}, {"term": "Vertical / horizontal", "definition": "Video or photo orientation for social vs MLS.", "group": "What we sell", "example": "A reel for Instagram is vertical. The MLS video is horizontal."}, {"term": "Branded / Unbranded", "definition": "Video with or without agent branding. Both get delivered.", "group": "What we sell", "example": "The delivery email has two video links: one branded with the agent's details and one unbranded."}, {"term": "Zillow 3D tour (Zillow 3D Home)", "definition": "360 walkthrough hosted on Zillow.", "group": "What we sell", "example": "An agent asks why their 3D tour is not public. It may be set to Private instead of Posted."}, {"term": "Interactive floor plan", "definition": "Floor plan bundled with Zillow 3D.", "group": "What we sell", "example": "The interactive floor plan can show up on Zillow a few hours after the 3D tour."}, {"term": "Matterport", "definition": "Premium 3D tour with dollhouse view. Includes 6 months of free hosting, then renewal is available (check the renewal price with Luke).", "group": "What we sell", "example": "An agent wants a 3D tour with a dollhouse view, so they book Matterport. Pricing uses square feet."}, {"term": "Dollhouse view", "definition": "Matterport's 3D model of the home.", "group": "What we sell", "example": "A client asks for the 3D model that shows the whole house from outside. That is Matterport's dollhouse view."}, {"term": "CubiCasa floor plan", "definition": "2D or 3D plan from CubiCasa.", "group": "What we sell", "example": "The floor plan for an order is made in CubiCasa and downloaded for delivery."}, {"term": "Property website", "definition": "Free single property site with most packages.", "group": "What we sell", "example": "The delivery email includes a link to the free property website for the home."}, {"term": "Virtual staging", "definition": "Furniture added to empty rooms. Priced per photo on the price list. In a test phase: nothing staged goes to a client until Luke says it is live.", "group": "What we sell", "example": "A late staging request goes in #virtual-staging with the address, room, photo, style and notes."}, {"term": "Virtual twilight", "definition": "Day exterior edited to dusk. We do not shoot real twilight on site.", "group": "What we sell", "example": "A daytime front photo is edited so the sky looks like dusk with the lights on."}, {"term": "Seasonal refresh", "definition": "Winter exterior edited to look like summer, or the reverse.", "group": "What we sell", "example": "A snowy exterior photo is edited to look like summer for a spring listing."}, {"term": "Grass replacement", "definition": "Patchy grass made green. Not for snow.", "group": "What we sell", "example": "Patchy brown grass is edited green. It does not work on snow."}, {"term": "Wire and cord removal", "definition": "Cords edited out.", "group": "What we sell", "example": "A TV cord hanging on the wall is edited out."}, {"term": "Property highlight", "definition": "Outline of the property, often on drone photos.", "group": "What we sell", "example": "A drone photo gets an outline around the property so buyers can see the lot."}, {"term": "Building unit highlight / property line", "definition": "Unit or lot line marked.", "group": "What we sell", "example": "A drone photo of a condo building gets the agent's unit marked."}, {"term": "Item removal / removal fee", "definition": "Objects edited out. Full room removal is charged per photo, per the price list.", "group": "What we sell", "example": "An agent asks to empty a whole room in one photo. That is a per photo removal fee from the price list. Call Luke first until T15 and T17 are signed off."}, {"term": "HDR / bracketing", "definition": "Several exposures merged.", "group": "Editing", "example": "Several shots at different brightness are merged so the window and the room both look right."}, {"term": "Verticals", "definition": "Walls that should stand straight.", "group": "Editing", "example": "An edit request says 'Photo 1218: straighten the verticals' because the walls lean."}, {"term": "Sky replacement", "definition": "Gray sky replaced in editing.", "group": "Editing", "example": "A shoot on a gray day still gets a nice sky because we replace it in editing."}, {"term": "Raw / raw files", "definition": "Unedited camera files.", "group": "Editing", "example": "If an unedited raw file ends up in the delivery folder, that is a QC catch."}, {"term": "Edited Count (\"250 Raw, 50 Edited\")", "definition": "Photo count field. Spiro total must match.", "group": "Editing", "example": "The Jobs sheet says 250 Raw, 50 Edited, so the delivered photo count should be 50 to match Spiro."}, {"term": "Photo number (e.g. 1218)", "definition": "Frame number used in edit requests.", "group": "Editing", "example": "An edit request names the photo by its number, like 'Photo 1218'."}, {"term": "Editing style", "definition": "Standard, Natural, Bright and Light, Architectural, Custom.", "group": "Editing", "example": "The Jobs sheet shows Bright and Light, so the editor uses that look."}, {"term": "STRICT", "definition": "Client pickiness: Standard, Strict, Very Strict.", "group": "Editing", "example": "Column O on the Jobs sheet shows Very Strict, which tells the team this client is very picky."}, {"term": "MLS Size / MLS Size folder", "definition": "Smaller export for MLS upload.", "group": "Editing", "example": "A team that needs MLS sized photos gets them in the MLS Size folder in Dropbox."}, {"term": "Final Pics folder", "definition": "Finished photos in Dropbox.", "group": "Editing", "example": "QC opens the Final Pics folder in Dropbox to check the finished photos."}, {"term": "Other Media folder", "definition": "Reference photos, for example for property highlights.", "group": "Editing", "example": "A reference photo showing the lot lines goes in Other Media for a property highlight."}, {"term": "AutoHDR", "definition": "AI editing and staging vendor. Uses credits.", "group": "Editing", "example": "Editing slows down when AutoHDR runs low on credits."}, {"term": "Credits", "definition": "Prepaid AutoHDR units. Running out stalls editing.", "group": "Editing", "example": "An #ops-alerts post warns that AutoHDR credits are running low, which could stall editing."}, {"term": "ApplyDesign", "definition": "Old staging vendor, being retired. Staging is moving to AutoHDR Re-edit (test phase from Oct 8).", "group": "Editing", "example": "An old staging order mentions ApplyDesign. New staging runs through AutoHDR Re-edit in #virtual-staging."}, {"term": "Visual Vibes", "definition": "Video editing team, works in Google Chat.", "group": "Editing", "example": "A video edit request goes to Visual Vibes in Google Chat, not Slack."}, {"term": "Spiro / PIVOT", "definition": "Our booking and delivery system. Clients see it as PIVOT.", "group": "Systems", "example": "A client says 'I booked in PIVOT'. Inside the team you find the order in Spiro."}, {"term": "booking.exposureit.com", "definition": "Client booking and media portal.", "group": "Systems", "example": "A new agent asks where to book. Send them to booking.exposureit.com."}, {"term": "On-Site Tracking", "definition": "Spiro view of each day's appointments.", "group": "Systems", "example": "You check On-Site Tracking in Spiro to see today's appointments."}, {"term": "Confirmation Notes", "definition": "Spiro notes with codes and reschedule asks.", "group": "Systems", "example": "A lockbox code for the house is in the order's Confirmation Notes in Spiro."}, {"term": "Edit button", "definition": "Changes packages and add-ons on an order.", "group": "Systems", "example": "An agent adds drone to an existing order. You use the Edit button in Spiro."}, {"term": "Custom fee", "definition": "One-off charge on an order.", "group": "Systems", "example": "A one-off charge for an approved extra goes on the order as a custom fee."}, {"term": "QC Photos task", "definition": "Spiro task started and completed at QC.", "group": "Systems", "example": "QC starts and completes the QC Photos task in Spiro when checking an order."}, {"term": "Delivery Status sheet", "definition": "Weekly workbook, one tab per shoot date.", "group": "Systems", "example": "Monday's deliveries are on the tab for that shoot date in the Delivery Status sheet."}, {"term": "Exposure It Jobs sheet (Editing Sheet)", "definition": "Photographer to editor handoff.", "group": "Systems", "example": "The photographer's handoff notes to the editors are on the Exposure It Jobs sheet."}, {"term": "Prep Complete", "definition": "Row ready for the next morning.", "group": "Systems", "example": "A row marked Prep Complete is ready for the next morning's delivery."}, {"term": "QC Complete", "definition": "QC done.", "group": "Systems", "example": "A row marked QC Complete has been checked and can be delivered."}, {"term": "DELIVERED", "definition": "Sent to client.", "group": "Systems", "example": "Once the client has their media, the row status is DELIVERED."}, {"term": "ESCALTED (sic)", "definition": "Escalated. The checkbox column is never used.", "group": "Systems", "example": "The status is spelled ESCALTED on the sheet. Use the status, not the checkbox column."}, {"term": "Issue Encountered / Edits Pending / Editors Not Done", "definition": "Delivery blockers.", "group": "Systems", "example": "A row showing Editors Not Done cannot be delivered yet."}, {"term": "Full QC / Light QC", "definition": "QC depth set by an internal list. Default is Light.", "group": "Systems", "example": "A row marked Full QC gets a deeper check and goes first in the delivery order."}, {"term": "VIP", "definition": "Purple name in Spiro. Delivery priority only.", "group": "Systems", "example": "A client's name shows purple in Spiro, so their delivery goes ahead of the biggest orders."}, {"term": "For Editors: Done? / For QC Person: Done?", "definition": "Columns R and S. Both checked means finished.", "group": "Systems", "example": "Both boxes in columns R and S are checked, so the job is finished."}, {"term": "Type of Delivery", "definition": "Spiro, Email, Dropbox, Showcase.", "group": "Systems", "example": "Column G says Dropbox, so the media goes out through Dropbox."}, {"term": "Dashboard", "definition": "Internal site: edit requests, unpaid, fee cases, drone airspace, incidents.", "group": "Systems", "example": "You log a late reason on the dashboard delivery page."}, {"term": "Hive", "definition": "Ops workbench: loops, client rules, templates, calls.", "group": "Systems", "example": "You open Hive to find a client's rules and your open loops."}, {"term": "Loop", "definition": "Open piece of work in Hive with next action and date.", "group": "Systems", "example": "A Hive loop for a missing floor plan has a next action and a follow-up date."}, {"term": "Handled flag", "definition": "Marks a message or call as dealt with.", "group": "Systems", "example": "After you call a client back, you set the handled flag on that call in Hive."}, {"term": "#schedule-changes", "definition": "Your channel: every cancel, reschedule, move.", "group": "Slack and bots", "example": "Rory posts a reschedule in #schedule-changes. You update Spiro, and the daily sheets only if the shoot is today."}, {"term": "Check mark reaction", "definition": "\"Handled\" record on a bot post.", "group": "Slack and bots", "example": "After the change is done, you react with a check mark so everyone knows it is handled."}, {"term": "#ops-alerts", "definition": "Bot alert queue. 8:09 AM brief is your to-do list.", "group": "Slack and bots", "example": "The 8:09 AM brief in #ops-alerts is your to-do list for the morning."}, {"term": "Heard on Quo, not in Spiro yet", "definition": "Bot flag: a call mentioned a change Spiro does not show.", "group": "Slack and bots", "example": "A caller asked to move a shoot, but Spiro does not show it, so the bot flags it for you."}, {"term": "Requester not found", "definition": "Bot could not match the caller to a client.", "group": "Slack and bots", "example": "The bot could not match a caller to a client, so you look them up yourself."}, {"term": "Delivery risk alert", "definition": "Job due within 2 hours still open.", "group": "Slack and bots", "example": "A job due within 2 hours is still open, so a delivery risk alert posts."}, {"term": "No photos uploaded", "definition": "Editors' flag that a folder is empty.", "group": "Slack and bots", "example": "Editors post No photos uploaded because the Dropbox folder for a shoot is empty."}, {"term": "All folders QC'd", "definition": "Joan's morning finish post.", "group": "Slack and bots", "example": "Joan posts All folders QC'd when the morning check is finished."}, {"term": "EDIT REQUEST card", "definition": "The formal edit post in #edit-requests: address, editor tag, Dropbox link, bullets.", "group": "Slack and bots", "example": "Makena posts an EDIT REQUEST card with the address, editor tag, Dropbox link and bullets."}, {"term": "#edit-requests-intake", "definition": "Field staff send agent edit asks here first.", "group": "Slack and bots", "example": "A photographer hears an agent's edit ask and sends it to #edit-requests-intake first."}, {"term": "#waitlist", "definition": "Actually the Spiro cancellations feed.", "group": "Slack and bots", "example": "Despite its name, #waitlist shows Spiro cancellations."}, {"term": "Lost Lead Alert", "definition": "Title of #call-review summaries. Most are normal bookings.", "group": "Slack and bots", "example": "A Lost Lead Alert in #call-review is usually just a normal booking call."}, {"term": "Rory / Max", "definition": "Rory is the ops bot, Max is the chief of staff bot.", "group": "Slack and bots", "example": "Rory posts the 5:09 PM handoff to the overnight editors. Max is the chief of staff bot."}, {"term": "Sona", "definition": "AI phone answering after hours on Quo. Say Sona inside the team and our after hours answering service with clients (some old notes say Ellie).", "group": "Slack and bots", "example": "A client calls at 7 PM and Sona, the AI answering service, takes the call."}, {"term": "Moderation queue", "definition": "Held mail in Google group inboxes.", "group": "Slack and bots", "example": "A client email is stuck in a Google group inbox's moderation queue until someone releases it."}, {"term": "Noon next business day", "definition": "Public delivery promise.", "group": "Money and policy", "example": "A client asks when photos will be ready. You say 'by noon the next business day'."}, {"term": "10:30 cutoff", "definition": "Internal morning delivery target.", "group": "Money and policy", "example": "The team aims to deliver by 10:30 to 11 AM, but you never tell a client that."}, {"term": "Shot Partial", "definition": "Spiro email: part of the shoot is still owed.", "group": "Money and policy", "example": "A Spiro email says Shot Partial because the drone part still needs to be shot. Treat it as urgent."}, {"term": "Return trip / second appointment", "definition": "Go back to finish or reshoot. Free when we missed it.", "group": "Money and policy", "example": "We missed the backyard, so the photographer goes back for free."}, {"term": "Reshoot toggle", "definition": "Spiro flag used only when we caused it.", "group": "Money and policy", "example": "The reshoot toggle is set only when we caused the reshoot."}, {"term": "Edit request (formal)", "definition": "Template post to Warly: address, Dropbox link, who asked, preventable or not, bullets.", "group": "Money and policy", "example": "You post to Warly: the address, the Dropbox link, who asked, preventable or not, then one bullet per fix."}, {"term": "Agent / Admin request", "definition": "Who asked for the edit.", "group": "Money and policy", "example": "The agent's assistant asked for the edit, so it is an admin request."}, {"term": "Preventable / not preventable", "definition": "Was the edit our fault.", "group": "Money and policy", "example": "A tilted wall we missed in QC is preventable. A late change of mind by the agent is not."}, {"term": "Redeliver", "definition": "Send updated media after an edit.", "group": "Money and policy", "example": "After the edit is done, you redeliver the updated photos."}, {"term": "Cancellation fee", "definition": "Charged for a cancel inside 24 hours (amount on the price list). An agent's first one is waived and noted.", "group": "Money and policy", "example": "An agent cancels 10 hours before the shoot. The late cancel fee applies unless it is their first late cancel, which a person decides to waive."}, {"term": "Pending reschedule fee", "definition": "Spiro option when the new date is not set.", "group": "Money and policy", "example": "An agent wants to move a shoot but has no new date, so Spiro's pending reschedule option is used."}, {"term": "Travel fee", "definition": "Applies past the core radius, up to the custom quote distance. Say the amount only when Spiro shows the travel fee box at booking. Never guess it.", "group": "Money and policy", "example": "A shoot outside the core radius has a travel fee. You say the amount only if Spiro shows the travel fee box, never a guess."}, {"term": "Core radius", "definition": "Our no travel fee area around the office. The distances are on the price list.", "group": "Money and policy", "example": "A home inside the core radius has no travel fee."}, {"term": "7% sales tax", "definition": "PA tax added to invoices.", "group": "Money and policy", "example": "A package on the price list has 7% Pennsylvania sales tax added on the invoice."}, {"term": "Card on file", "definition": "Charged at delivery.", "group": "Money and policy", "example": "An agent with a card on file is charged at delivery."}, {"term": "Open client payment link", "definition": "The only link that lets an agent pay. Preview photos stay watermarked until the client pays.", "group": "Money and policy", "example": "An agent asks how to pay. You send the open client payment link from the Spiro Agent Invoice."}, {"term": "Credit balance client", "definition": "Pays as credit card so credits deduct.", "group": "Money and policy", "example": "A client with prepaid credit pays as credit card so the credits deduct."}, {"term": "Day 7 / 14 / 21 / 30 chase", "definition": "Unpaid invoice reminders. Luke sends them until your T21 sign off in Week 4.", "group": "Money and policy", "example": "An invoice is 7 days unpaid. For now Luke sends the reminder."}, {"term": "Payout QC", "definition": "Checking photographer pay rows before pay Wednesday.", "group": "Money and policy", "example": "Before pay Wednesday, you check the photographer pay rows on the payout sheet."}, {"term": "Key / Steady / Emerging", "definition": "Client tiers. You own Steady.", "group": "Money and policy", "example": "A Steady client gets your logged monthly check-in. Key clients stay with Luke and Zach."}, {"term": "Escalation clocks", "definition": "10 min field, 45 min late, 60 min edit, 24 h Zillow.", "group": "Money and policy", "example": "A photographer is stuck at the house for 10 minutes, so the field clock says escalate."}, {"term": "QuickEdit", "definition": "CubiCasa's free floor plan editor. Renames rooms, sets Space Type, hides dimensions and adds text labels. Computer only, in Google Chrome.", "group": "Systems", "example": "You fix a VIP floor plan client's room names live in QuickEdit during the review call."}, {"term": "Space Type", "definition": "The CubiCasa setting for what a room actually is. It sets the room's color and whether the space counts toward total square footage.", "group": "Systems", "example": "A custom name like Sitting Room keeps the old Space Type, so you check it after renaming."}, {"term": "Change Request", "definition": "A fix sent to CubiCasa's production team for walls, doors, windows, fixed furniture or plan rotation. A few are free per order, then each one costs extra, so ask Luke before sending more. Room labels never need one.", "group": "Systems", "example": "A doorway in the wrong spot goes in as a Change Request; a wrong room name you fix yourself."}, {"term": "GLA plan", "definition": "A CubiCasa floor plan version that shows gross living area. Custom labels can print as \"Other Room\" there unless you add a space after the label name.", "group": "Systems", "example": "Free text and moved labels don't carry onto GLA plans, so check them separately."}, {"term": "Undefined space", "definition": "A small CubiCasa space with no room type. Undefined labels don't print by default, so renaming alone can leave it invisible.", "group": "Systems", "example": "Set Name and Space Type to Closet and hide its dimensions so the name shows."}, {"term": "Zillow Showcase (Aryeo)", "definition": "A paid Zillow listing upgrade. We upload the media to it in Aryeo after Rory's Showcase alert.", "group": "Systems", "example": "Rory's alert shows a paid Showcase order for 123 Example St, so you fulfill it in Aryeo."}, {"term": "Viktor", "definition": "Our virtual staging bot. It runs AutoHDR Re-edit and posts each run in #virtual-staging.", "group": "Slack and bots", "example": "Viktor posts the before and after for a living room in #virtual-staging for your review."}, {"term": "AutoHDR Re-edit", "definition": "The AutoHDR process Viktor uses for virtual staging. In test phase from Oct 8: results go to a Dropbox testing folder, never to clients.", "group": "Editing", "example": "A late staging request is posted in #virtual-staging and the Re-edit run picks it up."}, {"term": "#virtual-staging", "definition": "Slack channel for Viktor's staging runs, late staging requests and single room redos.", "group": "Slack and bots", "example": "You post a late request with the address, room, photo, style and notes."}, {"term": "#client-inbox", "definition": "Slack channel where main line voicemails land from Quo. You own the callbacks.", "group": "Slack and bots", "example": "Three voicemails are waiting at 8:05, so you call each one back."}, {"term": "Mailbox watch", "definition": "A bot that flags client emails sitting unanswered in your own inbox.", "group": "Slack and bots", "example": "The watch flags a 2 hour old agent email, so you reply now."}, {"term": "Office notification", "definition": "A Rory post in #ops-alerts for an office note from Spiro or info@ that needs action.", "group": "Slack and bots", "example": "\"Add green grass replacement\" becomes a formal edit request."}, {"term": "Ready list", "definition": "Your 8:30 Slack DM to Luke on a solo Monday: jobs due, what is blocked, what you need.", "group": "Systems", "example": "\"4 due, 1 waiting on uploads, need nothing yet.\""}, {"term": "Escalation ladder", "definition": "The order you go up for help: playbook, Slack DM Luke, phone Luke, then Zach. Dylan for photographers.", "group": "Money and policy", "example": "Luke does not answer a sick photographer call in 5 minutes, so you phone Zach."}, {"term": "On call", "definition": "Luke is reachable by phone 8 AM to 5 PM on your solo Mondays, Zach as backup.", "group": "Money and policy", "example": "On Oct 19 you DM Luke at 8:30, 10:45 and 1:00."}, {"term": "Reverse shadow", "definition": "You do the task while your trainer watches and checks, the step after watching them do it.", "group": "Systems", "example": "Thursday you press deliver on 2 jobs while Zach watches."}, {"term": "Mock Monday", "definition": "A full Monday morning run on real past data before your first solo Monday.", "group": "Systems", "example": "Friday Oct 16, 8 AM to noon, on the Mon Oct 5 events."}, {"term": "Callback script", "definition": "Take the caller's details, promise nothing, say when someone will call back.", "group": "Money and policy", "example": "\"Thanks, I have your details. Luke will call you back today.\""}, {"term": "Overnight question template", "definition": "The Hive template for asking the overnight editors or Joan something in #photo-editing.", "group": "Slack and bots", "example": "You ask Joan why 337 Example Ave is not QC'd yet."}]}</script>
<script>
(function(){
'use strict';
var DATA=JSON.parse(document.getElementById('qdata').textContent);
var KEY='ei_makena_quiz_v1';
var app=document.getElementById('app');
var mem={};
function load(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):{quizzes:{},flash:{known:[]}}}catch(e){return mem.s||{quizzes:{},flash:{known:[]}}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){mem.s=S}}
var S=load();S.quizzes=S.quizzes||{};S.flash=S.flash||{known:[]};
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function qz(id){for(var i=0;i<DATA.quizzes.length;i++)if(DATA.quizzes[i].id===id)return DATA.quizzes[i]}
function qById(id){var z=qz(id.split('-')[0]);for(var i=0;i<z.questions.length;i++)if(z.questions[i].id===id)return z.questions[i]}
function st(id){return S.quizzes[id]||(S.quizzes[id]={best:null,passed:false,attempts:0,missed:[],last:null})}
function fmtDate(t){var d=new Date(t);return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
function allMissed(){var a=[];DATA.quizzes.forEach(function(z){a=a.concat(st(z.id).missed||[])});return a}
function typeLabel(q){return {mc:'Pick one',tf:'True or false',scenario:'What do you do next?',order:'Put in order',match:'Match them up'}[q.type]}
window.scrollTo(0,0);

/* HOME */
function home(){
  var passed=DATA.quizzes.filter(function(z){return st(z.id).passed}).length;
  var h='<div class="card"><h2>Welcome, Makena</h2><div class="muted">One short quiz a day. Tap a quiz to start. You get the answer right away, plus which card to review. Your progress saves on this device.</div>'+
  '<div class="bar"><i style="width:'+Math.round(passed/DATA.quizzes.length*100)+'%"></i></div><div class="small">'+passed+' of '+DATA.quizzes.length+' quizzes passed</div></div>';
  DATA.quizzes.forEach(function(z){
    var s=st(z.id);var badge=s.passed?'✓':(z.id==='rm'?'★':(z.id==='w1'?'20':z.id.slice(1)));
    var sc=s.best===null?'Not started':'Best: '+s.best+' of '+z.questions.length+(s.passed?' · Passed':' · Pass is '+z.pass);
    h+='<div class="card quiz-item" data-q="'+z.id+'"><div class="badge'+(s.passed?' pass':'')+'">'+badge+'</div><div class="info"><h3>'+esc(z.title)+'</h3><div class="muted">'+esc(z.goal)+'</div><div class="score">'+esc(z.when)+' · '+z.questions.length+' questions · '+sc+'</div></div></div>';
  });
  var m=allMissed().length;
  h+='<div class="card"><h3>More practice</h3>'+
     '<button class="btn alt" id="bMissed"'+(m?'':' disabled')+'>Retry missed questions only ('+m+')</button>'+
     '<button class="btn alt" id="bFlash">Flashcards: '+DATA.glossary.length+' words we use</button>'+
     '<button class="btn" id="bRes">My results (screenshot for Luke)</button></div>'+
     '<button class="btn ghost" id="bReset">Start over (clears saved progress)</button>';
  app.innerHTML=h;window.scrollTo(0,0);
  [].forEach.call(app.querySelectorAll('[data-q]'),function(el){el.onclick=function(){startQuiz(el.getAttribute('data-q'))}});
  document.getElementById('bMissed').onclick=function(){startMissed()};
  document.getElementById('bFlash').onclick=function(){flash()};
  document.getElementById('bRes').onclick=function(){results()};
  document.getElementById('bReset').onclick=function(){if(confirm('Clear all saved scores and flashcards on this device?')){S={quizzes:{},flash:{known:[]}};save();home()}};
}

/* QUIZ RUN */
var R=null;
function startQuiz(id){var z=qz(id);R={quiz:z,practice:false,qs:z.questions.slice(),i:0,score:0,missed:[],tagMiss:[]};ask()}
function startMissed(){var ids=allMissed();if(!ids.length)return;R={quiz:{id:'missed',title:'Retry missed',questions:[]},practice:true,qs:shuffle(ids.map(qById).filter(Boolean)),i:0,score:0,missed:[],tagMiss:[]};ask()}
function ask(){
  var q=R.qs[R.i];R.answered=false;
  var h='<div class="card"><div class="row" style="align-items:center"><div style="flex:1"><b>'+esc(R.quiz.title)+'</b><div class="small">Question '+(R.i+1)+' of '+R.qs.length+'</div></div><span class="pill">'+R.score+' right</span></div><div class="bar"><i style="width:'+Math.round(R.i/R.qs.length*100)+'%"></i></div></div>';
  h+='<div class="card"><div class="qtype">'+typeLabel(q)+(q.tag?'<span class="tag '+q.tag+'">'+(q.tag==='money'?'MONEY':'EMERGENCY')+'</span>':'')+'</div><p class="qtext">'+esc(q.q)+'</p><div id="body"></div><div id="fb"></div><div id="ctl"></div></div>';
  h+='<button class="btn ghost" id="bQuit">Leave quiz</button>';
  app.innerHTML=h;window.scrollTo(0,0);
  document.getElementById('bQuit').onclick=function(){if(R.i===0||confirm('Leave this quiz? This try will not be saved.'))home()};
  var body=document.getElementById('body');
  if(q.type==='mc'||q.type==='scenario'){
    var order=shuffle(q.options.map(function(o,i){return i}));
    order.forEach(function(oi){var b=document.createElement('button');b.className='opt';b.textContent=q.options[oi];b.onclick=function(){if(R.answered)return;mark(b,oi===q.answer);[].forEach.call(body.children,function(c,k){c.disabled=true;if(order[k]===q.answer)c.classList.add('right')});if(oi!==q.answer)b.classList.add('wrong');done(oi===q.answer)};body.appendChild(b)});
  }else if(q.type==='tf'){
    [['True',true],['False',false]].forEach(function(p){var b=document.createElement('button');b.className='opt';b.textContent=p[0];b.onclick=function(){if(R.answered)return;[].forEach.call(body.children,function(c,k){c.disabled=true;if((k===0)===q.answer)c.classList.add('right')});if(p[1]!==q.answer)b.classList.add('wrong');done(p[1]===q.answer)};body.appendChild(b)});
  }else if(q.type==='order'){
    var pool=shuffle(q.steps.map(function(s,i){return i}));while(pool.length>1&&pool.every(function(v,k){return v===k}))pool=shuffle(pool);
    var picked=[];
    body.innerHTML='<div class="small">Tap the steps in the right order.</div><div class="picked" id="pk"></div><div id="pl"></div>';
    var ctl=document.getElementById('ctl');
    function draw(){
      var pk=document.getElementById('pk'),pl=document.getElementById('pl');pk.innerHTML='';pl.innerHTML='';
      if(!picked.length)pk.innerHTML='<div class="small" style="padding:8px">Your order shows here.</div>';
      picked.forEach(function(si,k){var d=document.createElement('button');d.className='opt sel';d.innerHTML='<span class="num">'+(k+1)+'</span>'+esc(q.steps[si]);d.disabled=R.answered;d.onclick=function(){if(R.answered)return;picked.splice(k,1);draw()};pk.appendChild(d)});
      pool.forEach(function(si){if(picked.indexOf(si)>=0)return;var b=document.createElement('button');b.className='opt';b.textContent=q.steps[si];b.onclick=function(){if(R.answered)return;picked.push(si);draw()};pl.appendChild(b)});
      ctl.innerHTML='<button class="btn" id="bChk"'+(picked.length===q.steps.length?'':' disabled')+'>Check my order</button>';
      document.getElementById('bChk').onclick=function(){var ok=picked.every(function(v,k){return v===k});R.answered=true;var kids=document.getElementById('pk').children;picked.forEach(function(v,k){kids[k].disabled=true;kids[k].classList.remove('sel');kids[k].classList.add(v===k?'right':'wrong')});
        if(!ok){var c=document.createElement('div');c.className='small';c.style.marginTop='8px';c.innerHTML='<b>Right order:</b> '+q.steps.map(function(s,k){return (k+1)+'. '+esc(s)}).join('<br>');document.getElementById('pk').appendChild(c)}
        done(ok)};
    }
    draw();return;
  }else if(q.type==='match'){
    var rights=shuffle(q.pairs.map(function(p){return p[1]}));
    q.pairs.forEach(function(p,k){var d=document.createElement('div');d.className='matchrow';d.innerHTML='<b>'+esc(p[0])+'</b>';var s=document.createElement('select');s.innerHTML='<option value="">Choose…</option>'+rights.map(function(r){return '<option>'+esc(r)+'</option>'}).join('');s.onchange=chk;d.appendChild(s);body.appendChild(d)});
    var ctl2=document.getElementById('ctl');ctl2.innerHTML='<button class="btn" id="bChk" disabled>Check my matches</button>';
    function chk(){var sels=body.querySelectorAll('select');document.getElementById('bChk').disabled=[].some.call(sels,function(s){return !s.value})}
    document.getElementById('bChk').onclick=function(){var sels=body.querySelectorAll('select');var ok=true;[].forEach.call(sels,function(s,k){var good=s.value===q.pairs[k][1];ok=ok&&good;s.disabled=true;var row=s.parentNode;row.classList.add(good?'right':'wrong');if(!good){var c=document.createElement('div');c.className='small';c.style.marginTop='6px';c.textContent='Right answer: '+q.pairs[k][1];row.appendChild(c)}});done(ok)};
  }
}
function mark(){}
function done(ok){
  var q=R.qs[R.i];R.answered=true;[].forEach.call(document.querySelectorAll('#body .opt'),function(b){b.disabled=true});
  if(ok)R.score++;else{R.missed.push(q.id);if(q.tag)R.tagMiss.push(q.id)}
  if(R.practice){var zid=q.id.split('-')[0];var s=st(zid);if(ok)s.missed=s.missed.filter(function(x){return x!==q.id});save()}
  var ctl=document.getElementById('ctl');ctl.innerHTML='';
  document.getElementById('fb').innerHTML='<div class="fb '+(ok?'ok':'bad')+'"><strong>'+(ok?'Right!':'Not quite')+'</strong>'+esc(q.why)+'<div class="review">Review: '+esc(q.card)+'</div></div>';
  ctl.innerHTML='<button class="btn" id="bNext">'+(R.i+1<R.qs.length?'Next question':'See my score')+'</button>';
  document.getElementById('bNext').onclick=function(){R.i++;if(R.i<R.qs.length)ask();else finish()};
  document.getElementById('bNext').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function finish(){
  var z=R.quiz,total=R.qs.length,passed=false,h='';
  if(!R.practice){
    var s=st(z.id);passed=R.score>=z.pass&&!(z.strict&&R.tagMiss.length);
    s.attempts++;if(s.best===null||R.score>s.best)s.best=R.score;if(passed)s.passed=true;
    s.missed=R.missed.slice();s.last={score:R.score,total:total,passed:passed,date:Date.now(),tagMiss:R.tagMiss.length};save();
  }
  h='<div class="card center"><div class="muted">'+esc(z.title)+'</div><div class="big">'+R.score+' / '+total+'</div>';
  if(R.practice)h+='<span class="pill">Practice round</span><p class="muted">Questions you got right are cleared from your missed list.</p>';
  else if(passed)h+='<span class="pill ok">Passed</span><p class="muted">Nice work. Pass mark: '+z.pass+' of '+total+(z.strict?', with no miss on money or emergencies':'')+'.</p>';
  else h+='<span class="pill bad">Not yet</span><p class="muted">Pass mark: '+z.pass+' of '+total+(z.strict?', with no miss on money or emergencies':'')+'. '+(z.strict&&R.tagMiss.length?'You missed '+R.tagMiss.length+' money or emergency question'+(R.tagMiss.length>1?'s':'')+'. ':'')+'Review the cards below and try again.</p>';
  h+='</div>';
  if(R.missed.length){h+='<div class="card"><h3>Review these</h3>'+R.missed.map(function(id){var q=qById(id);return '<div class="missed"><b>'+esc(q.q)+'</b><br>'+esc(q.why)+'<br><span class="small">Review: '+esc(q.card)+'</span></div>'}).join('')+'</div>'}
  h+='<div class="card">'+(R.missed.length&&!R.practice?'<button class="btn" id="bRM">Retry just the '+R.missed.length+' I missed</button>':'')+'<button class="btn alt" id="bAgain">Take it again</button><button class="btn alt" id="bRes2">My results</button><button class="btn ghost" id="bHome">Back to all quizzes</button></div>';
  app.innerHTML=h;window.scrollTo(0,0);
  var rm=document.getElementById('bRM');if(rm)rm.onclick=function(){var ids=R.missed.slice();R={quiz:{id:'missed',title:'Retry missed · '+z.title},practice:true,qs:ids.map(qById),i:0,score:0,missed:[],tagMiss:[]};ask()};
  document.getElementById('bAgain').onclick=function(){R.practice?startMissed():startQuiz(z.id)};
  document.getElementById('bRes2').onclick=results;document.getElementById('bHome').onclick=home;
}

  '<div class="card"><div class="muted">Take a screenshot of the box above and send it to Luke in Slack. Or copy it as text:</div><button class="btn" id="bCopy">Copy results as text</button><button class="btn ghost" id="bHome">Back to all quizzes</button></div>';
  app.innerHTML=h;window.scrollTo(0,0);
  document.getElementById('bHome').onclick=home;
  document.getElementById('bCopy').onclick=function(){var t='Exposure It | Makena quiz results, '+fmtDate(Date.now())+'\n'+DATA.quizzes.map(function(z){var s=st(z.id);return z.title+': '+(s.best===null?'not started':s.best+'/'+z.questions.length+(s.passed?' passed':' not yet'))}).join('\n')+'\nFlashcards known: '+S.flash.known.length+'/'+DATA.glossary.length;
    var b=this;function okd(){b.textContent='Copied ✓'}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(okd,function(){prompt('Copy this:',t)});else prompt('Copy this:',t)};
}

/* FLASHCARDS */
var F=null;
function flash(group){
  var groups=['All'];DATA.glossary.forEach(function(g){if(groups.indexOf(g.group)<0)groups.push(g.group)});
  group=group||'All';
  var deck=DATA.glossary.filter(function(g){return group==='All'||g.group===group});
  var unknown=deck.filter(function(g){return S.flash.known.indexOf(g.term)<0});
  F={group:group,deck:shuffle(unknown.length?unknown:deck),i:0,flipped:false};
  drawFlash(groups);
}
function drawFlash(groups){
  var deck=DATA.glossary.filter(function(g){return F.group==='All'||g.group===F.group});
  var known=deck.filter(function(g){return S.flash.known.indexOf(g.term)>=0}).length;
  var c=F.deck[F.i];
  var h='<div class="card"><h2>Flashcards</h2><div class="muted">Tap the card to flip it. Mark the ones you know and the rest come back.</div><div class="chips">'+groups.map(function(g){return '<button class="chip'+(g===F.group?' on':'')+'" data-g="'+esc(g)+'">'+esc(g)+'</button>'}).join('')+'</div>'+
  '<div class="bar"><i style="width:'+Math.round(known/deck.length*100)+'%"></i></div><div class="small">'+known+' of '+deck.length+' known</div></div>';
  if(!c){h+='<div class="card center"><div class="big">100%</div><p>You know every card in this group.</p></div>'}
  else h+='<div class="flash" id="fc">'+(F.flipped?'<div class="def">'+esc(c.definition)+'</div>'+(c.example?'<div class="ex">'+esc(c.example)+'</div>':''):'<div class="grp">'+esc(c.group)+'</div><div class="term">'+esc(c.term)+'</div><div class="small" style="margin-top:12px">Tap to see the meaning</div>')+'</div>'+
  '<div class="row"><button class="btn alt" id="bAgain2">Still learning</button><button class="btn" id="bKnow">I know it ✓</button></div><div class="small center" style="margin-top:8px">Card '+(F.i+1)+' of '+F.deck.length+'</div>';
  h+='<button class="btn ghost" id="bHome">Back to all quizzes</button>';
  app.innerHTML=h;
  [].forEach.call(app.querySelectorAll('[data-g]'),function(el){el.onclick=function(){flash(el.getAttribute('data-g'))}});
  document.getElementById('bHome').onclick=home;
  if(!c)return;
  document.getElementById('fc').onclick=function(){F.flipped=!F.flipped;drawFlash(groups)};
  function next(){F.i++;F.flipped=false;if(F.i>=F.deck.length){var left=F.deck.filter(function(g){return S.flash.known.indexOf(g.term)<0});F.deck=shuffle(left);F.i=0}drawFlash(groups)}
  document.getElementById('bKnow').onclick=function(){if(S.flash.known.indexOf(c.term)<0)S.flash.known.push(c.term);save();next()};
  document.getElementById('bAgain2').onclick=next;
}
home();
window.__EIQ={data:DATA,state:function(){return S}};
})();
</script>
